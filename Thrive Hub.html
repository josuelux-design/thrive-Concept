<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thrive TRM — Hub</title>
  <link rel="stylesheet" href="css/tokens.css" />
  <template id="__bundler_thumbnail">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
      <rect width="100" height="100" fill="#444CE7"/>
      <g fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M38 56a11 11 0 0 1 2.4-21.7 15 15 0 0 1 29 3.2A10.6 10.6 0 0 1 71 56"/>
        <path d="M54.5 50v18M47 57.5 54.5 50 62 57.5"/>

  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body { background: var(--bg-secondary); }
    #root { height: 100vh; }
    ::-webkit-scrollbar { width: 12px; height: 12px; }
    ::-webkit-scrollbar-thumb { background: var(--color-gray-300); border-radius: 9999px; border: 3px solid transparent; background-clip: padding-box; }
    ::-webkit-scrollbar-thumb:hover { background: var(--color-gray-400); background-clip: padding-box; border: 3px solid transparent; }
    select, input, button { font-family: var(--font-body); }
    @keyframes tt-fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes tt-pop { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
    @keyframes cp-slide { from { transform: translateX(24px); opacity: 0.4; } to { transform: translateX(0); opacity: 1; } }
    @keyframes cp-drop { from { transform: translateY(-8px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .cp-tabs { -ms-overflow-style: none; scrollbar-width: none; }
    .cp-tabs::-webkit-scrollbar { display: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="js/icons.jsx"></script>
  <script type="text/babel" src="js/components.jsx"></script>
  <script type="text/babel" src="js/hub-data.jsx"></script>
